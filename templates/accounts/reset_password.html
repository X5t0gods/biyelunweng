{% extends 'base.html' %}

{% block title %}重置密码 - {{ SHOP_NAME }}{% endblock %}

{% block content %}
<h5 class="mb-3 fw-bold"><i class="bi bi-key text-primary"></i> 重置密码：{{ object.real_name|default:object.username }}</h5>

<div class="card">
    <div class="card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            {% include 'includes/form_fields.html' %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> 确认重置</button>
                <a href="{% url 'accounts:user_list' %}" class="btn btn-outline-secondary">返回</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
